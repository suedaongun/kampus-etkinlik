<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Güncelle | Kampüs Etkinlikleri</title>
  <link rel="stylesheet" href="css/2311012082.css">
  <script type="module" src="js/event-form.js"></script>
</head>
<body>
  <div class="sayfa-kapsayici">
    <header class="site-header">
      <h1 class="site-baslik">Etkinlik Güncelle</h1>
      <nav class="ana-menu">
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html">Ekle</a>
      </nav>
    </header>

    <main class="ana-icerik">
      <p class="form-intro" style="font-size:0.95rem; color:#555; margin-bottom:1.2rem;">
        Alanlar mevcut etkinliğin bilgileriyle dolu gelir. Bu sprintte form veri güncellemez.
      </p>

      <div class="form-kapsayici" style="background:#fff; border:1px solid #ddd; border-radius:var(--kose); padding:1.5rem; max-width:600px;">
        <!-- data-mode="guncelle" önemli: id yoksa JS burayı hata kutusuna çevirir -->
        <form id="etkinlik-formu" data-mode="guncelle" novalidate style="display:flex; flex-direction:column; gap:1rem;">
          <div class="form-grubu" style="display:flex; flex-direction:column; gap:0.3rem;">
            <label for="ad" style="font-weight:bold; color:var(--renk-ana);">Etkinlik Adı *</label>
            <input type="text" id="ad" name="ad" style="padding:0.6rem; border:1px solid #ccc; border-radius:var(--kose);">
            <span class="hata-yazisi" id="ad-hata" style="color:var(--renk-hata, #c62828); font-size:0.85rem; font-weight:bold; display:none;"></span>
          </div>

          <div class="form-grubu" style="display:flex; flex-direction:column; gap:0.3rem;">
            <label for="kategori" style="font-weight:bold; color:var(--renk-ana);">Kategori *</label>
            <select id="kategori" name="kategori" style="padding:0.6rem; border:1px solid #ccc; border-radius:var(--kose);">
              <option value="">Seçiniz</option>
              <option value="Seminer">Seminer</option>
              <option value="Atölye">Atölye</option>
              <option value="Söyleşi">Söyleşi</option>
            </select>
            <span class="hata-yazisi" id="kategori-hata" style="color:var(--renk-hata, #c62828); font-size:0.85rem; font-weight:bold; display:none;"></span>
          </div>

          <div class="form-grubu" style="display:flex; flex-direction:column; gap:0.3rem;">
            <label for="tarih" style="font-weight:bold; color:var(--renk-ana);">Tarih *</label>
            <input type="date" id="tarih" name="tarih" style="padding:0.6rem; border:1px solid #ccc; border-radius:var(--kose);">
            <span class="hata-yazisi" id="tarih-hata" style="color:var(--renk-hata, #c62828); font-size:0.85rem; font-weight:bold; display:none;"></span>
          </div>

          <div class="form-grubu" style="display:flex; flex-direction:column; gap:0.3rem;">
            <label for="saat" style="font-weight:bold; color:var(--renk-ana);">Saat *</label>
            <input type="time" id="saat" name="saat" style="padding:0.6rem; border:1px solid #ccc; border-radius:var(--kose);">
            <span class="hata-yazisi" id="saat-hata" style="color:var(--renk-hata, #c62828); font-size:0.85rem; font-weight:bold; display:none;"></span>
          </div>

          <div class="form-grubu" style="display:flex; flex-direction:column; gap:0.3rem;">
            <label for="yer" style="font-weight:bold; color:var(--renk-ana);">Yer *</label>
            <input type="text" id="yer" name="yer" style="padding:0.6rem; border:1px solid #ccc; border-radius:var(--kose);">
            <span class="hata-yazisi" id="yer-hata" style="color:var(--renk-hata, #c62828); font-size:0.85rem; font-weight:bold; display:none;"></span>
          </div>

          <div class="form-grubu" style="display:flex; flex-direction:column; gap:0.3rem;">
            <label for="kontenjan" style="font-weight:bold; color:var(--renk-ana);">Kontenjan</label>
            <input type="number" id="kontenjan" name="kontenjan" style="padding:0.6rem; border:1px solid #ccc; border-radius:var(--kose);">
            <span class="hata-yazisi" id="kontenjan-hata" style="color:var(--renk-hata, #c62828); font-size:0.85rem; font-weight:bold; display:none;"></span>
          </div>

          <div class="form-grubu" style="display:flex; flex-direction:column; gap:0.3rem;">
            <label for="aciklama" style="font-weight:bold; color:var(--renk-ana);">Açıklama</label>
            <textarea id="aciklama" name="aciklama" rows="3" style="padding:0.6rem; border:1px solid #ccc; border-radius:var(--kose);"></textarea>
          </div>

          <button type="submit" style="padding: 0.75rem 1.8rem; background: var(--renk-ana); color: #fff; border: none; border-radius: var(--kose); font-weight: bold; cursor: pointer; width: fit-content;">
            Güncelle
          </button>
        </form>

        <div id="form-mesaj"></div>
      </div>
    </main>

    <footer>
       Sueda Ongun · 2311012082 · 2026
    </footer>
  </div>
</body>
</html>
